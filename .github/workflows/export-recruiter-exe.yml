name: Export recruiter EXE

on:
  push:
    paths:
      - .github/workflows/export-recruiter-exe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact v3.3.0 EXE asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/octet-stream" \
            /repos/${GITHUB_REPOSITORY}/releases/assets/589778676 \
            > Propeller_Calculator_Professional_UA_v3_3.exe
          test "$(stat -c%s Propeller_Calculator_Professional_UA_v3_3.exe)" = "138957867"
          echo "7e7b7e10d75d23c114fece289e7beb03020d5e7001e2e570ce9538f536f2fd7d  Propeller_Calculator_Professional_UA_v3_3.exe" | sha256sum -c -

      - name: Upload exact EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: propeller-recruiter-exe
          path: Propeller_Calculator_Professional_UA_v3_3.exe
          retention-days: 7
          if-no-files-found: error
